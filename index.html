  <!-- 🧹 FIX: limpieza de Service Worker heredado — CAUSA RAÍZ de que la
       traducción/tafsir de Isa García (y cualquier otro fix de este build)
       parezca "no aplicarse": la app tuvo Service Worker + manifest.json
       hasta hace muy poco (ver CHANGELOG "PWA eliminado"). Un dispositivo
       que instaló la app como PWA (o generó el APK vía PWA Builder /
       Bubblewrap, que empaqueta esa misma URL) tiene ese SW activo AÚN
       DESPUÉS de borrar sw.js del proyecto — el navegador no lo desinstala
       solo, y sigue sirviendo desde su Cache Storage el index.html/JS
       antiguos (sin garcia-data.js, sin las correcciones v29-v32, etc.),
       sin importar cuántas veces se corrija el código fuente. Aquí se
       desregistra cualquier SW y se borra toda caché que no sea la de
       audio del Corán (uso intencional, no relacionado con el SW).
       Se ejecuta en cada carga; si no hay nada que limpiar, no hace nada. -->
  <script>
    (function () {
      try {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (reg) { reg.unregister(); });
          }).catch(function () {});
        }
        if (window.caches && caches.keys) {
          caches.keys().then(function (names) {
            names.forEach(function (name) {
              if (name !== 'quba-quran-audio-v1') caches.delete(name).catch(function () {});
            });
          }).catch(function () {});
        }
      } catch (e) { /* silencioso: nunca debe romper el arranque */ }
    })();
  </script>

  <!-- 🌐 Detección temprana de idioma (antes de que scripts corran) -->
  <script>
    (function(){
      try {
        var s = JSON.parse(localStorage.getItem('quba_settings') || '{}');
        var lang = s.locale || (navigator.language || 'es').slice(0,2);
        if (['es','ar','en'].indexOf(lang) < 0) lang = 'es';
        document.documentElement.lang = lang;
        document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
      } catch(e){}
    })();
  </script>
