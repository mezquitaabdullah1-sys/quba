  <!-- 📦 App shell offline + carga instantánea — ver sw.js para el porqué.
       v1.0.32 desregistraba cualquier Service Worker en cada carga (ver
       CHANGELOG "PWA eliminado" / "FIX raíz: Service Worker heredado") para
       curar un SW viejo que se quedaba activo para siempre sirviendo JS
       desactualizado. Ese SW nuevo (sw.js) arregla la causa real de aquello
       (sin skipWaiting/clients.claim ni caché versionada por build, nunca
       tomaba el control ni se autolimpiaba) — así que ya no hace falta
       desregistrarlo a mano: cada build se reemplaza sola. Desregistrar
       aquí de nuevo anularía el propio arreglo (instantáneo + offline). -->
  <link rel="manifest" href="manifest.json">
  <script>
    (function () {
      try {
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', function () {
            navigator.serviceWorker.register('./sw.js').catch(function () {
              /* silencioso: sin SW la app sigue funcionando, solo pierde
                 la carga instantánea/offline — nunca debe romper el arranque */
            });
          });
        }
      } catch (e) { /* silencioso: nunca debe romper el arranque */ }
    })();
  </script>

  <!-- 🌐 Detección temprana de idioma (antes de que scripts corran) -->
  <script>
    (function(){

        var s = JSON.parse(localStorage.getItem('quba_settings') || '{}');
        var lang = s.locale || (navigator.language || 'es').slice(0,2);
        if (['es','ar','en'].indexOf(lang) < 0) lang = 'es';
        document.documentElement.lang = lang;
        document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
      } catch(e){}
    })();
  </script>
