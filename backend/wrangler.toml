name = "quba-proxy"
main = "cloudflare-worker.js"
compatibility_date = "2026-01-01"

# KV namespace para cache de traducciones, du'as y geocoding.
# Crear con: wrangler kv:namespace create "QUBA_KV"
# Luego reemplaza el id de abajo.
[[kv_namespaces]]
binding = "QUBA_KV"
id = "REPLACE_WITH_KV_ID"

[vars]
# Puedes añadir aquí variables no secretas
ENVIRONMENT = "production"

# Límites recomendados
[limits]
cpu_ms = 50
